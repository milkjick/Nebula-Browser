plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mice.nebulamcp'
    compileSdk 34

    defaultConfig {
        applicationId "com.mice.nebulamcp"
        minSdk 26
        targetSdk 34
        versionCode 11
        versionName "0.5.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}


    // AIDE/offline-friendly: release packaging must not require downloading
    // lint-gradle from Google's Maven repository. Lint is not required to
    // produce the APK; CI can re-enable these tasks when dependencies exist.
    tasks.matching { task ->
        task.name.startsWith("lintVital")
    }.configureEach {
        enabled = false
    }

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Local MCP HTTP gateway server (same pattern as the DeepSeek gateway project)
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    // Minimal JSON — org.json ships with Android, no extra dep needed.
}

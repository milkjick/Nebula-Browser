<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nebula</title>
<style>
    :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --accent: #3b82f6;
        --accent2: #22d3ee;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        padding: 24px;
    }
    .logo {
        font-size: 42px;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 24px;
    }
    .search-box {
        width: min(600px, 90vw);
        display: flex;
        gap: 12px;
    }
    .search-box input {
        flex: 1;
        height: 52px;
        border: 1px solid #334155;
        background: #1e293bcc;
        border-radius: 26px;
        padding: 0 22px;
        font-size: 16px;
        color: var(--text);
        outline: none;
        backdrop-filter: blur(10px);
        transition: border 0.2s;
    }
    .search-box input:focus {
        border-color: var(--accent);
    }
    .search-box button {
        height: 52px;
        padding: 0 26px;
        border: none;
        border-radius: 26px;
        background: var(--accent);
        color: white;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
    }
    .search-box button:hover { background: #2563eb; transform: scale(1.03); }
    .shortcuts {
        display: flex;
        gap: 20px;
        margin-top: 40px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .shortcut {
        width: 80px;
        height: 80px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #1e293bcc;
        border-radius: 18px;
        color: var(--text);
        text-decoration: none;
        font-size: 13px;
        transition: background 0.2s, transform 0.2s;
    }
    .shortcut:hover { background: #334155; transform: translateY(-4px); }
    .shortcut .icon { font-size: 28px; }
    .hint {
        margin-top: 40px;
        font-size: 13px;
        color: var(--muted);
    }
</style>
</head>
<body>
    <div class="logo">NEBULA</div>
    <form class="search-box" action="#" method="get" onsubmit="return NebulaHomeSubmitSearch(this);">
        <input id="nebula-search-input" type="text" name="q" placeholder="搜索网页或输入网址" autocomplete="off" autofocus>
        <button type="submit">搜索</button>
    </form>
    <div class="shortcuts">
        <a class="shortcut" href="https://www.bilibili.com"><span class="icon">📺</span>哔哩哔哩</a>
        <a class="shortcut" href="https://www.zhihu.com"><span class="icon">💡</span>知乎</a>
        <a class="shortcut" href="https://github.com"><span class="icon">🐙</span>GitHub</a>
        <a class="shortcut" href="https://www.youtube.com"><span class="icon">▶️</span>YouTube</a>
        <a class="shortcut" href="https://www.baidu.com"><span class="icon">🔍</span>百度</a>
    </div>
    <div class="hint">自定义主题可在浏览器菜单中编辑 HTML/CSS</div>
<script>
function NebulaHomeSubmitSearch(form){
    var input=form && form.querySelector ? form.querySelector('input[name="q"]') : null;
    var query=input ? input.value.trim() : '';
    if(!query){
        if(input){ input.focus(); input.setCustomValidity('请输入搜索内容'); input.reportValidity(); setTimeout(function(){input.setCustomValidity('');},1200); }
        return false;
    }
    if(window.NebulaHome && typeof window.NebulaHome.search === 'function'){
        window.NebulaHome.search(query);
    }
    return false;
}
</script>
</body>
</html>
